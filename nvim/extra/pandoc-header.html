<!--
  Injected with `pandoc -H`, see 'after/ftplugin/markdown.lua'.
-->

<script type="module">
  const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

  // Mermaid ---------------------------------------------------------------
  // Pandoc renders ```mermaid as `<pre class="mermaid"><code>…</code></pre>`,
  // but mermaid wants the source as the direct text of the element.
  const diagrams = document.querySelectorAll("pre.mermaid");
  if (diagrams.length > 0) {
    try {
      const { default: mermaid } =
        await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? "dark" : "default",
        securityLevel: "loose",
      });
      for (const pre of diagrams) {
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = pre.textContent;
        pre.replaceWith(div);
      }
      await mermaid.run({ querySelector: "div.mermaid" });
    } catch (err) {
      console.warn("mermaid unavailable, leaving diagram source as-is:", err);
    }
  }

  // Heading anchors -------------------------------------------------------
  for (const h of document.querySelectorAll(
    "h1[id], h2[id], h3[id], h4[id], h5[id], h6[id]",
  )) {
    if (h.classList.contains("title")) continue;
    const a = document.createElement("a");
    a.className = "anchor";
    a.href = "#" + h.id;
    a.textContent = "#";
    a.ariaLabel = "Link to this section";
    h.append(a);
  }

  // Copy button on code blocks --------------------------------------------
  for (const pre of document.querySelectorAll("pre")) {
    if (pre.classList.contains("mermaid")) continue;
    if (!pre.querySelector("code")) continue;

    // The `<pre>` scrolls horizontally, and an absolutely positioned child
    // scrolls along with its content, so the button needs a wrapper that
    // stays put.
    const wrap = document.createElement("div");
    wrap.className = "code-wrap";
    pre.replaceWith(wrap);
    wrap.append(pre);

    const button = document.createElement("button");
    button.className = "copy";
    button.type = "button";
    button.textContent = "copy";
    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(
          pre.querySelector("code").innerText,
        );
        button.textContent = "copied";
      } catch {
        button.textContent = "failed";
      }
      setTimeout(() => (button.textContent = "copy"), 1200);
    });
    wrap.append(button);
  }
</script>
